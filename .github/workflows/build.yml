name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests (geometry, embroidery files, UI end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Garment geometry sweep (6,048 variants)
        run: npx tsx tests/geometry.test.ts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyembroidery "pypdf[image]" playwright
      - name: Embroidery files byte-identical to pyembroidery
        run: |
          npx tsx tests/embroidery_gen.ts tests/out
          python tests/embroidery_check.py tests/out
      - name: Build single-file app
        run: npm run build:single
      - run: python -m playwright install --with-deps chromium
      - name: UI end-to-end (Phases 1-2)
        run: python tests/e2e.py "$PWD/dist-single/index.html" e2e-out
      - name: UI end-to-end (Phase 3 production files)
        run: python tests/e2e_phase3.py "$PWD/dist-single/index.html" e2e-out
      - name: UI end-to-end (Phase 4 showcase)
        run: python tests/e2e_phase4.py "$PWD/dist-single/index.html" e2e-out
      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: e2e-out

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build THREADFORGE.exe + installers
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: THREADFORGE-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Is this version released yet?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          python scripts/release_notes.py "$v" release-notes.md
      - name: Create release and attach installers (new version on main)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ver.outputs.new == 'true') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: THREADFORGE v${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
